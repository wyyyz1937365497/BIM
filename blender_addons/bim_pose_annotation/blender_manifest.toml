schema_version = "1.0.0"
id = "bim_pose_annotation"
version = "0.1.0"
name = "BIM Pose Annotation"
tagline = "Align TRELLIS geometry to 3DGS and export pose ground truth"
maintainer = "TJ BIM Project"
type = "add-on"
tags = ["3D View", "Object"]
blender_version_min = "4.3.0"
license = ["SPDX:GPL-3.0-or-later"]

[permissions]
files = "Read source assets and export annotation manifests"

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "*.zip",
]
